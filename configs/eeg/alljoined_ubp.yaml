# Alljoined encoder (bs256, lr=5e-5, val early-stop). Paths overridden by --dataset-profile.
timesteps: [0, 250]

blur_kernel_size: 51
system_g: 3

dataset: alljoined
c_num: 32
name: "Alljoined"

models:
  brain:
    target: "encoder.models.${brain_backbone}"
    params:
        c_num: ${c_num}
        z_dim: ${z_dim}
        timesteps: ${timesteps}

data:
  # Paths are overridden by ``--dataset-profile alljoined_eeg``.
  data_dir: ""
  image_root: data/things-eeg/Image_set_Resize
  selected_ch: "None"
  model_type: ${vision_backbone}
  train_batch_size: 256
  val_batch_size: 200
  test_batch_size: 200
  blur_type:
    target: encoder.models.FoveaBlur
    params:
          h: 224
          w: 224
          blur_kernel_size: ${blur_kernel_size}
          curve_type: exp
          system_g: ${system_g}
  train_avg: True
  test_avg: True
  timesteps: ${timesteps}
  n_train_classes: 1654
  n_test_classes: 200

train:
  epoch: ${epoch}
  optimizer: AdamW
  lr: ${lr}
  weight_decay: 1e-4
  monitor_val: true
  early_stop_patience: 10

save_dir: 'checkpoints/encoder'
