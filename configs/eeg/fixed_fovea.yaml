timesteps: [0,250]

blur_kernel_size: 51
system_g: 3

# Lightning layout: checkpoints/encoder/THINGSEEG2/<sub>_seed*/checkpoints/
name: "THINGSEEG2"

models:
  brain:
    target: "encoder.models.${brain_backbone}"
    params:
        c_num: 63
        z_dim: ${z_dim}
        timesteps: ${timesteps}

data:
  data_dir: data/things-eeg/Preprocessed_data_250Hz_whiten
  selected_ch: "None"
  model_type: ${vision_backbone}
  train_batch_size: 1024
  val_batch_size: 200
  test_batch_size: 200
  uncertainty_aware: False
  blur_type:
    target: encoder.models.FoveaBlur
    params:
          h: 224
          w: 224
          blur_kernel_size: ${blur_kernel_size}
          curve_type: exp
          system_g: ${system_g}
  train_avg: True
  test_avg: True
  timesteps: ${timesteps}

train:
  epoch: ${epoch}
  optimizer: AdamW
  lr: ${lr}

save_dir: 'checkpoints/encoder'
