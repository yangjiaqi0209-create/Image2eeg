id: alljoined_eeg
display_name: Alljoined-1.6M
c_num: 32
timesteps:
- 0
- 250
seq_len: 250
brain_input_dim: 8000
trial_format: repeated
train_avg: true
test_avg: true
per_trials_train: 4
per_trials_test: 80
n_train_classes: 1654
n_test_classes: 200
subjects:
- sub-01
- sub-02
- sub-03
- sub-04
- sub-05
- sub-06
- sub-07
- sub-08
- sub-09
- sub-10
- sub-11
- sub-12
- sub-13
- sub-14
- sub-15
- sub-16
- sub-17
- sub-18
- sub-19
- sub-20
channels_ref: encoder.data.ALLJOINED_CHANNELS
paths:
  eeg_data_root: '{eeg_data_root}/alljoined-1.6M'
  data_dir: '{repo_root}/data/processed/alljoined/preprocessed'
  image_root: '{repo_root}/data/things-eeg/Image_set_Resize'
  feature_dir: '{repo_root}/data/processed/alljoined/encoder_features/FoveaBlur'
  hf_raw_dir: '{eeg_data_root}/alljoined-1.6M/raw_hf/preprocessed_eeg'
  clip_feature_blur: FoveaBlur
preprocess:
  script: src/preprocess/convert_alljoined.py
  batch_script: experiments/alljoined/launch.sh
  docs: README.md
train:
  encoder_config: configs/alljoined/encoder_final.yaml
  encoder_exp: Alljoined_things_matched_buffered
  encoder_exp_prefix: Alljoined_things_matched_buffered
  clip_mode: fixed_fovea
  predictor_ckpt_dir: '{repo_root}/checkpoints/alljoined/generator/stage2'
  results_dir: '{repo_root}/results/alljoined'
eval:
  n_test_trials: 80
